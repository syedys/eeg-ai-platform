[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-ai-platform"
version = "0.1.0"
description = "A production-style EEG machine-learning portfolio platform."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Syed Yaseen Shah", email = "yasinshah@gmail.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]